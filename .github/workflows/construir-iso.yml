# NOVORA OS — pruebas y construcción real de la ISO (R-09 de la revisión).
# Corre en los servidores de GitHub: NO toca ningún disco físico del usuario.
name: Construir ISO

on:
  workflow_dispatch:
    inputs:
      atlas_requerido:
        description: "Fallar si no se puede instalar el motor de ATLAS (llama.cpp)"
        type: boolean
        default: false
      subir_iso:
        description: "Subir también la ISO como artefacto (varios GB; en repos privados gratuitos el límite de almacenamiento es bajo)"
        type: boolean
        default: false
  pull_request:
    paths: ["config/**", "scripts/**", "tests/**", ".github/workflows/construir-iso.yml"]
  push:
    branches: [main]
    paths: ["config/**", "scripts/**", "tests/**", ".github/workflows/construir-iso.yml"]

permissions:
  contents: read

concurrency:
  group: construir-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas automáticas
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Batería completa (incluye discos loop desechables)
        run: |
          set -o pipefail
          sudo env "PATH=$PATH" bash tests/run-tests.sh 2>&1 | tee pruebas.log
      - name: Mostrar el error como anotación
        if: failure()
        run: |
          echo "::error title=Pruebas: líneas con fallos::$(grep -nE 'FAIL|ERROR|FALLÓ|Traceback|Error|error:|SC[0-9]{4}' pruebas.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::error title=Pruebas: final del registro::$(tail -80 pruebas.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"

  iso:
    name: Construir la ISO en Debian 13
    needs: pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en el servidor
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Construir con live-build (contenedor debian:trixie)
        env:
          ATLAS_FLAG: ${{ inputs.atlas_requerido && '--atlas-required' || '' }}
        run: |
          set -o pipefail
          sudo docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/src -w /src -e ATLAS_FLAG \
            debian:trixie bash -euo pipefail -c '
              apt-get update -q
              apt-get install -y -q --no-install-recommends \
                live-build debootstrap xorriso squashfs-tools ca-certificates git
              git config --global --add safe.directory /src
              bash scripts/build-iso.sh $ATLAS_FLAG' 2>&1 | tee construccion.log

      - name: Mostrar el error como anotación
        if: failure()
        run: |
          echo "::error title=ISO: final de la salida::$(tail -150 construccion.log 2>/dev/null | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::error title=ISO: espacio libre::$(df -h / | sed ':a;N;$!ba;s/\n/%0A/g')"

      - name: Resumen
        if: always()
        run: |
          {
            echo "## NOVORA OS — construcción"
            if ls build/*.sha256 >/dev/null 2>&1; then
              echo "ISO creada: \`$(cat build/*.sha256)\`"
              echo "Tamaño: $(du -h build/*.iso | cut -f1)"
            else
              echo "**No se generó la ISO.** Revisa \`build.log\` en los artefactos."
            fi
            echo
            echo "### Avisos de NOVORA en la construcción"
            echo '```'
            grep -h "NOVORA AVISO" build/build.log 2>/dev/null | sort -u | head -50 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Registro, huella y lista de paquetes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novora-os-construccion
          path: |
            construccion.log
            build/build.log
            build/*.sha256
            build/*.packages
          if-no-files-found: warn
          retention-days: 14

      - name: ISO (opcional)
        if: success() && inputs.subir_iso
        uses: actions/upload-artifact@v4
        with:
          name: novora-os-iso
          path: build/*.iso
          compression-level: 0
          retention-days: 3
